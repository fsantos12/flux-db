[workspace]
resolver = "3"
members = ["crates/core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["Filipe Santos <filipesantos__12@hotmail.com>"]
license = "MIT"
publish = false

[workspace.dependencies]

# --- Serialization & Formats ---
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"

# --- Types ---
chrono       = { version = "0.4.44", features = ["serde"] }
rust_decimal = { version = "1.41.0", features = ["serde-float"] }
uuid         = { version = "1.23.1", features = ["v7", "serde"] }

# --- Collections ---
smallvec = "1.11"
smol_str = "0.3"

# --- Async & Runtime ---
async-trait = "0.1"
futures     = "0.3"